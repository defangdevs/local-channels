# Tests run on the floor interpreter the plugins promise to support (3.9, the
# RHEL 9 / Ubuntu server baseline) and on current 3.x, so a 3.10+ism or a
# deprecation on the new side both fail the PR.
name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  whatsapp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: local-whatsapp/package-lock.json
      - name: Install and test local-whatsapp
        working-directory: local-whatsapp
        run: |
          npm ci --ignore-scripts
          npm test

  test:
    # ubuntu-latest is 26.04, which has no Python 3.9 build for setup-python.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: End-to-end test of local-slack (mock Slack, real local-webhook bus)
        run: python tests/e2e/run_e2e.py

  release:
    # Versions are assigned here, after merge, so PRs never bump them and never
    # collide on the version lines. The range is derived from the repo itself
    # (changes since each plugin's last version change), so a cancelled or
    # superseded run loses nothing: the next one picks it up.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, whatsapp]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: version-tags
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      # The pushed commit, which the tests above approved, not whatever main is now.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Bump versions for plugins with unreleased changes
        id: bump
        run: |
          # No pipe: a failing script must fail the step (default shell has no pipefail).
          python scripts/release_bump.py > bumped.txt
          cat bumped.txt
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          [ -s bumped.txt ] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "release: $(paste -sd, bumped.txt)"
          # If main moved on, this is rejected as non-fast-forward. That is fine:
          # the newer push has its own run, and the rule is stateless, so it
          # releases everything this run would have.
          if git push origin HEAD:main; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "main moved; leaving the bump to the newer run"
          fi

  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: version-tags
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Publish immutable version tags
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/tag_versions.py --push
