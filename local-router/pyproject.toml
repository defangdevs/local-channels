# Lets other projects install the router without a separate repo:
#   pip install "git+https://github.com/defangdevs/local-channels#subdirectory=local-router"
# router.py has no dependencies and also runs straight from a checkout.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-router"
dynamic = ["version"]
description = "Decide which agent session an incoming message belongs to (continue, new, or new with links)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
local-router = "router:_entry"

[tool.setuptools]
py-modules = ["router"]

[tool.setuptools.dynamic]
version = {attr = "router.VERSION"}
